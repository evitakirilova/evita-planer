<!doctype html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3F524E"><link rel="manifest" href="manifest.json">
<title>Plānotājs</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: light; font-family: Arial, sans-serif; color:#212121; background:#f2f2f1; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box; }
  main { width:min(100%,420px); padding:28px; border-radius:20px; background:#fff; box-shadow:0 8px 28px #0001; text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; color:#3F524E; } p { line-height:1.5; }
  button { background:#3F524E; color:white; border:0; border-radius:10px; padding:13px 20px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; } #message { min-height:3em; }
</style></head><body><main>
<h1>Plānotājs</h1><p id="message" role="status">Ielādē privāto plānotāju…</p>
<button id="login" type="button" hidden>Pieslēgties ar Google</button>
</main><script>
(() => {
  const CLIENT_ID = '457566382983-0tsi1v5b6300nca77udoviiuv8jgaklb.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/calendar.readonly';
  const FILE_ID = '1mfBN8alg_gdvfxbupUZlWMPkTVjSrRBA';
  const message = document.getElementById('message');
  const button = document.getElementById('login');
  function say(text) { message.textContent = text; }
  async function openPlanner(token) {
    button.disabled = true;
    say('Ielādē privāto plānotāju…');
    try {
      const response = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(FILE_ID) + '?alt=media',
        { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
      if (response.status === 401) {
        localStorage.removeItem('_gds_token');
        throw new Error('Google sesija beigusies. Pieslēdzies vēlreiz.');
      }
      if (response.status === 403 || response.status === 404)
        throw new Error('Šim Google kontam nav piekļuves privātajam plānotājam. Izvēlies savu kontu.');
      if (!response.ok) throw new Error('Drive kļūda: ' + response.status);
      const html = await response.text();
      if (!html.includes('const GDS =') || !html.includes('id="drive-btn"'))
        throw new Error('Plānotāja fails nav derīgs.');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      say(error.message || 'Neizdevās atvērt plānotāju.');
      button.hidden = false;
      button.disabled = false;
    }
  }
  function signIn() {
    if (!window.google?.accounts?.oauth2) { say('Google pieslēgums vēl ielādējas. Mēģini vēlreiz.'); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: response => {
        if (response.error || !response.access_token) {
          say('Google pieslēgšanās neizdevās. Mēģini vēlreiz.');
          return;
        }
        localStorage.setItem('_gds_token', JSON.stringify({
          access_token: response.access_token,
          expires_at: Date.now() + (response.expires_in || 3600) * 1000
        }));
        openPlanner(response.access_token);
      },
      error_callback: () => say('Google logs neatvērās. Atver lapu parastā pārlūkā un mēģini vēlreiz.')
    });
    client.requestAccessToken({ prompt: 'select_account' });
  }
  button.addEventListener('click', signIn);
  let saved;
  try { saved = JSON.parse(localStorage.getItem('_gds_token') || 'null'); } catch (_) {}
  if (saved?.access_token && saved.expires_at > Date.now() + 60000) openPlanner(saved.access_token);
  else { say('Pieslēdzies ar savu Google kontu, lai atvērtu plānotāju.'); button.hidden = false; }
})();
</script></body></html>
